name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    name: ruff, mypy (core), unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: mypy (core modules; strict mode is not enforced yet)
        run: mypy src/interceptor/core
      - name: unit tests (database tests skip without INTERCEPTOR_TEST_DSN)
        run: python -m unittest discover -s tests -t .

  database:
    name: database tests against PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERCEPTOR_TEST_DSN: "host=127.0.0.1 port=5432 dbname=interceptor_test user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: create the test database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE interceptor_test"
      - name: database tests
        run: python -m unittest discover -s tests -t .
