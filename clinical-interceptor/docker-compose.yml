# Local PostgreSQL for development and the DB tests. Bound to loopback only; the credentials are throwaway dev values.
# Not verified here: Docker was not available on the build machine.
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev-only-password
      POSTGRES_DB: interceptor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interceptor"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
