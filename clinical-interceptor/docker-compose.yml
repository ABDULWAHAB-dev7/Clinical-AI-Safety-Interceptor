# Local stack: PostgreSQL 18, the interceptor API, and (behind the "nli" profile) the NLI inference service.
#
#   cp .env.example .env        # then set INTERCEPTOR_PSEUDO_KEY (32+ random characters)
#   docker compose up --build
#   docker compose --profile nli up --build    # also the NLI service, for the claims the rules cannot settle
#
# The NLI service needs the approved checkpoint. The image bakes it in and checks it against the lock, so
# nothing has to be mounted. Set NLI_BAKE_MODEL=0 and mount a checkpoint yourself if you would rather not
# carry the weights in an image.
#
# Published on 127.0.0.1 only. Clinical endpoints also need the client-certificate headers from a trusted proxy
# (API 2.1), so this stack serves the health and unauthenticated routes on its own. Use scripts/dev_server.py for
# the full mTLS path.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: interceptor
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"   # override DB_PORT if the port is taken
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 image: mount the parent directory, not /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interceptor"]
      interval: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      INTERCEPTOR_DATABASE_URL: "host=db port=5432 dbname=interceptor user=postgres password=${POSTGRES_PASSWORD:-dev-only-password}"
      INTERCEPTOR_PSEUDO_KEY: ${INTERCEPTOR_PSEUDO_KEY:?set INTERCEPTOR_PSEUDO_KEY in .env}
      INTERCEPTOR_TRUSTED_PROXIES: "127.0.0.1"
      # "none" blocks the claims the rules cannot settle (rule R2). Set it to "remote" and start the nli profile
      # to use the approved checkpoint instead.
      INTERCEPTOR_NLI_MODE: ${INTERCEPTOR_NLI_MODE:-none}
      INTERCEPTOR_NLI_ENDPOINT: ${INTERCEPTOR_NLI_ENDPOINT:-http://nli:8100}
      INTERCEPTOR_NLI_TOKEN: ${NLI_SERVICE_TOKEN:-}
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"   # override API_PORT if the port is taken

  nli:
    profiles: ["nli"]
    build:
      context: ./nli_service
      dockerfile: Dockerfile.vercel
    environment:
      NLI_MODEL_PATH: /models/nli/cross-encoder-nli-deberta-v3-base
      NLI_MODEL_LOCK: /app/nli_service/MODEL.lock
      NLI_SERVICE_TOKEN: ${NLI_SERVICE_TOKEN:-}
      OMP_NUM_THREADS: "4"
    ports:
      - "127.0.0.1:${NLI_PORT:-18100}:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/v1/health')\""]
      interval: 10s
      retries: 30
      start_period: 180s   # loading the checkpoint takes about a minute

volumes:
  pgdata:
