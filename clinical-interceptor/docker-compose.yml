# Local stack: PostgreSQL 18 and the interceptor API. Migrations run when the API container starts.
#
#   cp .env.example .env        # then set INTERCEPTOR_PSEUDO_KEY (32+ random characters)
#   docker compose up --build
#
# Published on 127.0.0.1 only. Clinical endpoints also need the client-certificate headers from a trusted proxy
# (API 2.1), so this stack serves the health and unauthenticated routes on its own. Use scripts/dev_server.py for
# the full mTLS path.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
      POSTGRES_DB: interceptor
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"   # override DB_PORT if the port is taken
    volumes:
      - pgdata:/var/lib/postgresql   # PostgreSQL 18 image: mount the parent directory, not /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interceptor"]
      interval: 5s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      INTERCEPTOR_DATABASE_URL: "host=db port=5432 dbname=interceptor user=postgres password=${POSTGRES_PASSWORD:-dev-only-password}"
      INTERCEPTOR_PSEUDO_KEY: ${INTERCEPTOR_PSEUDO_KEY:?set INTERCEPTOR_PSEUDO_KEY in .env}
      INTERCEPTOR_TRUSTED_PROXIES: "127.0.0.1"
    ports:
      - "127.0.0.1:${API_PORT:-18000}:8000"   # override API_PORT if the port is taken

volumes:
  pgdata:
