name: ci

# GitHub reads workflows only from the repository root, so this file lives here and runs the project in
# clinical-interceptor/.

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: clinical-interceptor

jobs:
  checks:
    name: ruff, mypy --strict (core), pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      # store/ and fhir/ are not annotated yet, so mypy follows them silently. core/ is checked strictly.
      - name: mypy --strict (core)
        run: mypy --strict --follow-imports=silent src/interceptor/core
      - name: pytest (database tests skip without INTERCEPTOR_TEST_DSN)
        run: pytest

  database:
    name: database tests against PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      INTERCEPTOR_TEST_DSN: "host=127.0.0.1 port=5432 dbname=interceptor_test user=postgres password=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -r requirements-dev.txt
      - name: create the test database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE interceptor_test"
      - name: database tests
        run: pytest

  web:
    name: web typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinical-interceptor/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clinical-interceptor/web/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: unit tests
        run: npm test
      - name: build
        run: npm run build

  e2e:
    name: dashboard end-to-end and accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: clinical-interceptor/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clinical-interceptor/web/package-lock.json
      - name: install
        run: npm ci --no-audit --no-fund
      - name: install the browser
        run: npx playwright install --with-deps chromium
      - name: end-to-end tests (builds and starts the app itself)
        run: npm run e2e
